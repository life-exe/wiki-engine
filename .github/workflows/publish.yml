name: Publish to npm

on:
  push:
    branches:
      - master
    paths:
      - "package.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package version on npm
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current package.json version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if npm view "@life-exe/wiki-engine@$CURRENT_VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publication."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Version $CURRENT_VERSION is new. Proceeding with publish!"
          fi

      - name: Typecheck and lint
        if: steps.check_version.outputs.published == 'false'
        run: pnpm run lint

      - name: Build package
        if: steps.check_version.outputs.published == 'false'
        run: pnpm run build

      - name: Publish to npm (OIDC Trusted Publishing)
        if: steps.check_version.outputs.published == 'false'
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create Git Tag and GitHub Release
        if: steps.check_version.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.check_version.outputs.version }}"
          name: "Release v${{ steps.check_version.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
